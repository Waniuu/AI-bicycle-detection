<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mobility Counter Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --bg: #0f1117;
  --card-bg: #161b22;
  --border: #30363d;
  --text: #e0e0e0;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --header-bg: #161b22;
}
[data-theme="light"] {
  --bg: #f4f6f8;
  --card-bg: #ffffff;
  --border: #d0d7de;
  --text: #24292f;
  --text-muted: #57606a;
  --accent: #0969da;
  --header-bg: #ffffff;
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition: background 0.3s, color 0.3s;-webkit-text-size-adjust:100%}

header{background:var(--header-bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:1.05rem;color:var(--accent);white-space:nowrap}
header .dot{width:10px;height:10px;border-radius:50%;background:#f85149;flex-shrink:0}
header .dot.ok{background:#3fb950}
header .meta{margin-left:auto;font-size:0.75rem;color:var(--text-muted);white-space:nowrap}

.btn-header{background:var(--card-bg);border:1px solid var(--border);color:var(--accent);padding:5px 12px;border-radius:6px;font-size:0.75rem;cursor:pointer;text-decoration:none;font-weight:600}
.btn-header:hover{opacity:0.8}

.container{padding:16px;max-width:1440px;margin:0 auto}

/* Layout główny */
.dashboard-grid{display:grid;grid-template-columns: 1fr 380px;gap:16px;margin-bottom:16px}
@media(max-width: 1024px){.dashboard-grid{grid-template-columns:1fr}}

.left-stack{display:flex;flex-direction:column;gap:16px}
.right-stack{display:flex;flex-direction:column;gap:16px}

.card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:14px}
.card h3{font-size:0.85rem;color:var(--text);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}

/* Wideo podgląd */
.video-box{background:#000;border-radius:6px;overflow:hidden;position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.video-box img{width:100%;height:100%;object-fit:contain}
.video-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.75);padding:3px 8px;border-radius:4px;font-size:0.7rem;color:#3fb950;font-weight:600}

/* Kafelki statystyk */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:10px;margin-bottom:16px}
.stat-box{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px}
.stat-box .label{font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px}
.stat-box .value{font-size:1.4rem;font-weight:700;margin-top:2px}
.stat-box.bike .value{color:var(--accent)}
.stat-box.scooter .value{color:#d2a8ff}
.stat-box.total .value{color:#f0883e}
.stat-box.fps .value{color:#3fb950}

/* Formularze i suwaki */
.form-group{margin-bottom:8px}
.form-group label{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text-muted);margin-bottom:3px}
.form-group span.val{color:var(--accent);font-weight:bold}
.form-group input[type="range"]{width:100%;cursor:pointer;accent-color:#238636}
select.custom-select{width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.8rem;outline:none}

.btn-action{width:100%;padding:8px;background:#238636;color:white;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:0.8rem;margin-top:6px}
.btn-action:hover{opacity:0.9}

/* Wykresy i Tabela */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width: 768px){.charts-grid{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:0.8rem}
th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);color:var(--text-muted);font-size:0.7rem}
td{padding:6px 8px;border-bottom:1px solid var(--border)}
.badge-type{padding:2px 6px;border-radius:4px;font-size:0.7rem;font-weight:600}
.badge-type.bicycle{background:#28a745;color:#fff}
.badge-type.e-scooter{background:#d2a8ff;color:#161b22}
.no-data{color:var(--text-muted);font-style:italic;text-align:center;padding:14px}
</style>
</head>
<body>

<header>
  <div class="dot" id="statusDot"></div>
  <h1>Mobility Dashboard</h1>
  <button class="btn-header" onclick="toggleTheme()" id="themeBtn">🌓 Motyw</button>
  <a href="/database" class="btn-header">🗄️ Baza Danych</a>
  <span class="meta" id="fpsBadge" style="color:#3fb950; font-weight:bold">-- FPS</span>
</header>

<div class="container">

  <!-- Główne statystyki na górze -->
  <div class="stats-row">
    <div class="stat-box bike">
      <div class="label">Rowery Dziś</div>
      <div class="value" id="bikeTodayVal">0</div>
    </div>
    <div class="stat-box scooter">
      <div class="label">Hulajnogi Dziś</div>
      <div class="value" id="scooterTodayVal">0</div>
    </div>
    <div class="stat-box total">
      <div class="label">Razem Dziś</div>
      <div class="value" id="todayTotalVal">0</div>
    </div>
    <div class="stat-box fps">
      <div class="label">Aktywne Obiekty</div>
      <div class="value" id="activeVal">0</div>
    </div>
  </div>

  <div class="dashboard-grid">
    
    <!-- LEWA STRONA: Wideo + Wykresy + Ostatnie zdarzenia -->
    <div class="left-stack">
      <div class="card">
        <h3>📹 Podgląd na żywo</h3>
        <div class="video-box">
          <img id="videoFeed" src="/video" alt="Camera feed">
          <div class="video-badge" id="liveModeBadge">Live Camera</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="card">
          <h3>📈 Linia Czasu Przejazdów</h3>
          <canvas id="timelineChart" height="130"></canvas>
        </div>
        <div class="card">
          <h3>📊 Rozkład 15-minutowy</h3>
          <canvas id="quarterlyChart" height="130"></canvas>
        </div>
      </div>

      <div class="card">
        <h3>🔍 Ostatnie Detekcje</h3>
        <table>
          <thead><tr><th>Czas</th><th>Typ</th><th>Track ID</th></tr></thead>
          <tbody id="eventsBody"><tr><td colspan="3" class="no-data">Brak detekcji</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- PRAWA STRONA: Proste ustawienia i kalibracja -->
    <div class="right-stack">
      
      <!-- Model i Linia zliczająca -->
      <div class="card">
        <h3>⚙️ Ustawienia Zliczania</h3>
        <div class="form-group">
          <label>Aktywny Model AI</label>
          <select id="selectActiveModel" class="custom-select"></select>
        </div>
        <div class="form-group">
          <label>Początek linii X1: <span class="val" id="lbl_line_x1">0px</span></label>
          <input type="range" id="input_line_x1" min="0" max="1920" value="0">
        </div>
        <div class="form-group">
          <label>Początek linii Y1: <span class="val" id="lbl_line_y1">240px</span></label>
          <input type="range" id="input_line_y1" min="0" max="1080" value="240">
        </div>
        <div class="form-group">
          <label>Koniec linii X2: <span class="val" id="lbl_line_x2">640px</span></label>
          <input type="range" id="input_line_x2" min="0" max="1920" value="640">
        </div>
        <div class="form-group">
          <label>Koniec linii Y2: <span class="val" id="lbl_line_y2">240px</span></label>
          <input type="range" id="input_line_y2" min="0" max="1080" value="240">
        </div>
        <button type="button" id="btnSavePerm" class="btn-action">💾 Zapisz konfigurację</button>
      </div>

      <!-- Kalibracja wideo -->
      <div class="card">
        <h3>🧪 Test z Pliku Wideo</h3>
        <div class="form-group" style="display:flex; align-items:center; gap:8px; margin-bottom:10px">
          <input type="checkbox" id="checkCalibMode" style="cursor:pointer">
          <label for="checkCalibMode" style="cursor:pointer; color:var(--text); margin:0">Tryb testowy z pliku</label>
        </div>
        <div class="form-group">
          <select id="selectCalibFile" class="custom-select"></select>
        </div>
        <div style="display:flex; gap:6px">
          <button type="button" id="btnPlayPause" class="btn-action" style="background:#21262d; border:1px solid var(--border)">⏯️ Play/Pause</button>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
// Motyw kolorystyczny
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
}
if(localStorage.getItem('theme')) {
  document.documentElement.setAttribute('data-theme', localStorage.getItem('theme'));
}

// Wykresy Chart.js
const timelineData = {labels:[], datasets:[{label:'Przejazdy', data:[], borderColor:'#58a6ff', backgroundColor:'rgba(88,166,255,0.1)', fill:true, tension:0.3, pointRadius:2}]};
const timelineChart = new Chart(document.getElementById('timelineChart'), {type:'line', data:timelineData, options:{responsive:true, plugins:{legend:{display:false}}, scales:{x:{display:false}, y:{beginAtZero:true, grid:{color:'rgba(200,200,200,0.1)'}}}}});

const quarterlyChart = new Chart(document.getElementById('quarterlyChart'), {
  type:'bar', data:{labels:[], datasets:[{label:'Ruch', data:[], backgroundColor:'#238636', borderRadius:4}]},
  options:{responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:9}}}, y:{beginAtZero:true, grid:{color:'rgba(200,200,200,0.1)'}}}}
});

// Obsługa suwaków i konfiguracji
const sliders = ['line_x1', 'line_y1', 'line_x2', 'line_y2'];
sliders.forEach(id => {
  const el = document.getElementById('input_' + id);
  const lbl = document.getElementById('lbl_' + id);
  if(el && lbl) {
    el.addEventListener('input', e => {
      lbl.textContent = e.target.value + 'px';
      clearTimeout(window._debounce);
      window._debounce = setTimeout(() => {
        fetch('/api/config', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            line_x1: parseInt(document.getElementById('input_line_x1').value),
            line_y1: parseInt(document.getElementById('input_line_y1').value),
            line_x2: parseInt(document.getElementById('input_line_x2').value),
            line_y2: parseInt(document.getElementById('input_line_y2').value),
            persist: false
          })
        });
      }, 50);
    });
  }
});
let prevCount = 0;

// Pobieranie danych i statystyk z serwera FastAPI
async function fetchStats(){
  try{
    const r = await fetch('/stats');
    const d = await r.json();
    if(d.error) return;

    const bikeToday = d.bike_today || 0;
    const scooterToday = d.scooter_today || 0;
    const totalToday = d.today_total || (bikeToday + scooterToday);

    // Aktualizacja kafelków na górze
    document.getElementById('bikeTodayVal').textContent = bikeToday;
    document.getElementById('scooterTodayVal').textContent = scooterToday;
    document.getElementById('todayTotalVal').textContent = totalToday;
    document.getElementById('activeVal').textContent = d.active_tracks || 0;
    
    document.getElementById('fpsBadge').textContent = d.fps + ' FPS';
    document.getElementById('statusDot').className = d.fps > 0 ? 'dot ok' : 'dot';

    // 1. Aktualizacja wykresów liniowych (Timeline)
    if(totalToday !== prevCount){
      timelineData.labels.push(new Date().toLocaleTimeString());
      timelineData.datasets[0].data.push(totalToday);
      if(timelineData.labels.length > 20){
        timelineData.labels.shift();
        timelineData.datasets[0].data.shift();
      }
      timelineChart.update();
      prevCount = totalToday;
    }

    // 2. Aktualizacja wykresów 15-minutowych (Quarterly)
    if(d.quarterly && d.quarterly.length > 0){
      quarterlyChart.data.labels = d.quarterly.map(q => q.label || q.period);
      quarterlyChart.data.datasets[0].data = d.quarterly.map(q => q.count);
      quarterlyChart.update();
    }

    // 3. Odświeżenie tabeli "Ostatnie Detekcje" (Events)
    const tbody = document.getElementById('eventsBody');
    if(d.events && d.events.length > 0){
      tbody.innerHTML = d.events.slice(0, 10).map(e => {
        const vType = (e.vehicle_type || 'bicycle').toLowerCase();
        const cssClass = vType.includes('scooter') ? 'e-scooter' : 'bicycle';
        const displayName = vType.includes('scooter') ? 'e-scooter' : 'bicycle';
        return `<tr><td>${e.time_str || '-'}</td><td><span class="badge-type ${cssClass}">${displayName}</span></td><td>#${e.track_id}</td></tr>`;
      }).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="3" class="no-data">Brak detekcji</td></tr>';
    }
  }catch(e){
    console.error("Błąd pobierania statystyk:", e);
  }
}

// Interwał odświeżania statystyk co 0.5 sekundy
setInterval(fetchStats, 500);
fetchStats();

// Ładowanie listy modeli i plików wideo przy starcie
async function initSelects() {
  try {
    const mRes = await fetch('/api/models');
    const mData = await mRes.json();
    if(mData.models) {
      document.getElementById('selectActiveModel').innerHTML = Object.entries(mData.models).map(([k,v]) => `<option value="${k}">${v.name || k}</option>`).join('');
      if(mData.active) document.getElementById('selectActiveModel').value = mData.active;
    }
    const cRes = await fetch('/api/calibration/files');
    const cData = await cRes.json();
    if(cData.files) {
      const select = document.getElementById('selectCalibFile');
      select.innerHTML = cData.files.map(f => `<option value="${f}">${f}</option>`).join('');
      if(cData.files.length > 0) select.value = cData.files[0];
    }
  } catch(e){}
}
initSelects();

// Zapis konfiguracji na stałe (do config.yaml)
document.getElementById('btnSavePerm').addEventListener('click', async () => {
  try {
    await fetch('/api/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        line_x1: parseInt(document.getElementById('input_line_x1').value),
        line_y1: parseInt(document.getElementById('input_line_y1').value),
        line_x2: parseInt(document.getElementById('input_line_x2').value),
        line_y2: parseInt(document.getElementById('input_line_y2').value),
        persist: true
      })
    });
    alert("💾 Zapisano ustawienia na stałe w pliku config.yaml!");
  } catch(e) {
    alert("❌ Błąd zapisu konfigu.");
  }
});

// Obsługa trybu wideo (checkbox kalibracji)
document.getElementById('checkCalibMode').addEventListener('change', async (e) => {
  const enabled = e.target.checked;
  try {
    await fetch('/api/calibration/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled })
    });
  } catch (err) {}

  if (enabled) {
    const filename = document.getElementById('selectCalibFile').value;
    if (filename) {
      try {
        await fetch('/api/calibration/select', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename })
        });
      } catch (err) {}
    }
  }

  document.getElementById('liveModeBadge').textContent = enabled ? "Calibration File" : "Live Camera";
  document.getElementById('liveModeBadge').style.color = enabled ? "#d2a8ff" : "#3fb950";
});

// Zmiana pliku z listy
document.getElementById('selectCalibFile').addEventListener('change', async (e) => {
  const filename = e.target.value;
  try {
    await fetch('/api/calibration/select', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename })
    });
  } catch(e){}
});

// Przycisk Play / Pause
let isPaused = false;
document.getElementById('btnPlayPause').addEventListener('click', async () => {
  isPaused = !isPaused;
  const action = isPaused ? "pause" : "play";
  document.getElementById('btnPlayPause').textContent = isPaused ? "▶️ Wznowij" : "⏸️ Pauza";
  try {
    await fetch('/api/calibration/playback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action })
    });
  } catch (e) {}
});
</script>
</body>
</html>
